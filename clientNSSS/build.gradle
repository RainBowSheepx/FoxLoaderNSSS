// Client build.gradle
plugins {
    id 'maven-publish'
}

group 'com.fox2code'
version project['foxloader.version']

dependencies {
    api(project(":commonNSSS"))

    // Do not use API here
    implementation(fileTree(dir: 'libs', include: [project['alpha112.clientJar'] as String]))
    implementation(fileTree(dir: 'libs', include: [project['nsss.clientJar'] as String]))
    implementation(project(":additionalNSSS"))
    //noinspection GradlePackageUpdate
    // compileOnly changed to impl to run from idea
    implementation("net.java.jinput:jinput:2.0.5")
    //noinspection GradlePackageUpdate
    implementation("org.lwjgl.lwjgl:lwjgl:2.9.3")
    //noinspection GradlePackageUpdate
    implementation("org.lwjgl.lwjgl:lwjgl_util:2.9.3")
    //noinspection GradlePackageUpdate
    implementation("org.lwjgl.lwjgl:lwjgl-platform:2.9.3")

    // Do not expose LuaJ APIs to mods
    compileOnly('org.luaj:luaj-jse:3.0.1')

    // Do no expose spark APIs to mods
    compileOnly(project['spark.dependency'] as String)
}